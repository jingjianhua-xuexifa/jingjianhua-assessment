<style>
:root{
  --primary:#2563eb; --primary-dark:#1e40af; --primary-light:#dbeafe;
  --accent:#059669; --accent-light:#d1fae5;
  --warn:#f59e0b; --warn-light:#fef3c7;
  --danger:#ef4444; --danger-light:#fee2e2;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
  --gray-500:#6b7280; --gray-700:#374151; --gray-900:#111827;
  --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh; color:var(--gray-900); line-height:1.6;
}
#app{max-width:560px; margin:0 auto; min-height:100vh; background:#fff; position:relative; overflow:hidden;}

/* ===== 首页 ===== */
.page-home{padding:24px 20px 16px; text-align:center; display:flex; flex-direction:column; justify-content:flex-start;}
.home-icon{font-size:42px; margin-bottom:6px;}
.home-badge{display:inline-block; margin-bottom:10px; padding:5px 16px; font-size:12px; font-weight:700; color:#fff; background:linear-gradient(135deg,#2563eb,#7c3aed); border-radius:999px; letter-spacing:2px; box-shadow:0 4px 12px rgba(37,99,235,.3);}
.home-title{font-size:25px; font-weight:800; margin-bottom:5px; line-height:1.3;}
.home-subtitle{font-size:13.5px; color:var(--gray-500); margin-bottom:14px;}
.home-features{background:var(--gray-50); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; text-align:left;}
.home-features h3{font-size:13.5px; color:var(--gray-700); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.home-features ul{list-style:none;}
.home-features li{font-size:13px; color:var(--gray-700); padding:3px 0; display:flex; align-items:flex-start; gap:8px;}
.home-features li::before{content:"✓"; color:var(--accent); font-weight:700; flex-shrink:0;}
.dim-grid2{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px;}
.dim-item{background:var(--gray-50); border:1px solid var(--gray-200); border-radius:12px; padding:9px 11px; text-align:left;}
.dim-item strong{display:block; font-size:14.5px; color:var(--primary); margin-bottom:1px;}
.dim-item .dd{font-size:12px; color:var(--gray-500);}
.btn-start{background:var(--primary); color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 4px 14px rgba(37,99,235,.35);}
.btn-start:active{transform:scale(.97);}
.home-admin{margin-top:12px;}

/* ===== 通用按钮 ===== */
.btn{
  display:block; width:100%; padding:16px; border:none; border-radius:14px;
  font-size:17px; font-weight:700; cursor:pointer; transition:all .2s;
}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; box-shadow:0 4px 16px rgba(102,126,234,.4);}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{background:var(--gray-100); color:var(--gray-700);}
.btn-secondary:active{transform:scale(.97);}

/* ===== 答题页 ===== */
.page-quiz{padding:0; min-height:100vh; display:flex; flex-direction:column;}
.quiz-header{padding:20px 24px 12px;}
.quiz-progress-text{font-size:13px; color:var(--gray-500); margin-bottom:8px; display:flex; justify-content:space-between;}
.quiz-progress-bar{height:6px; background:var(--gray-100); border-radius:3px; overflow:hidden;}
.quiz-progress-fill{height:100%; background:linear-gradient(90deg,#667eea,#764ba2); border-radius:3px; transition:width .3s ease;}
.quiz-body{flex:1; padding:16px 24px 24px; display:flex; flex-direction:column;}
.quiz-dim-tag{font-size:12px; color:var(--primary); background:var(--primary-light); display:inline-block; padding:3px 12px; border-radius:20px; margin-bottom:12px; align-self:flex-start;}
.quiz-question{font-size:20px; font-weight:600; margin-bottom:28px; line-height:1.5;}
.quiz-options{display:flex; flex-direction:column; gap:10px;}
.quiz-option{
  padding:16px 18px; border:2px solid var(--gray-200); border-radius:14px;
  font-size:15px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:12px;
  background:#fff;
}
.quiz-option .opt-label{width:28px; height:28px; border-radius:50%; background:var(--gray-100); color:var(--gray-500); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex-shrink:0;}
.quiz-option.selected{border-color:var(--primary); background:var(--primary-light);}
.quiz-option.selected .opt-label{background:var(--primary); color:#fff;}
.quiz-option:active{transform:scale(.98);}
.quiz-nav{display:flex; gap:10px; margin-top:20px;}
.quiz-nav .btn{flex:1; padding:14px; font-size:15px;}

/* ===== 结果页 ===== */
.page-result{padding:32px 24px 40px; min-height:100vh;}
.result-header{text-align:center; margin-bottom:24px;}
.result-score-ring{
  width:120px; height:120px; border-radius:50%; margin:0 auto 16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:conic-gradient(var(--primary) 0deg, var(--gray-100) 0deg);
  position:relative;
}
.result-score-ring::before{content:""; position:absolute; inset:8px; border-radius:50%; background:#fff;}
.result-score-ring .score-num{position:relative; z-index:1; font-size:36px; font-weight:800; color:var(--gray-900);}
.result-score-ring .score-label{position:relative; z-index:1; font-size:12px; color:var(--gray-500);}
.result-title{font-size:22px; font-weight:800; margin-bottom:4px;}
.result-subtitle{font-size:14px; color:var(--gray-500);}
.result-index-note{font-size:12.5px; color:var(--gray-500); margin-top:12px; line-height:1.7; background:var(--gray-50); border-radius:10px; padding:10px 12px; text-align:left;}
.result-chart-wrap{margin:24px 0; text-align:center;}
.result-chart-wrap canvas{max-width:100%;}
.result-dims{margin-bottom:24px;}
.result-dim-card{
  background:var(--gray-50); border-radius:12px; padding:16px; margin-bottom:10px;
  border-left:4px solid var(--primary);
}
.result-dim-card.lv-good{border-left-color:var(--accent);}
.result-dim-card.lv-warn{border-left-color:var(--warn);}
.result-dim-card.lv-danger{border-left-color:var(--danger);}
.result-dim-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.result-dim-name{font-size:15px; font-weight:600;}
.result-dim-score{font-size:18px; font-weight:800;}
.result-dim-score.lv-good{color:var(--accent);}
.result-dim-score.lv-warn{color:var(--warn);}
.result-dim-score.lv-danger{color:var(--danger);}
.result-dim-bar{height:6px; background:var(--gray-200); border-radius:3px; margin-bottom:8px; overflow:hidden;}
.result-dim-bar-fill{height:100%; border-radius:3px; transition:width .6s ease;}
.result-dim-advice{font-size:13px; color:var(--gray-700); line-height:1.5;}

/* ===== 留资 ===== */
/* 信息采集卡片 */
.info-card{background:#fff; border:1px solid #E5E7EB; border-radius:var(--radius); padding:22px 20px; margin-bottom:20px;}
.info-card h3{font-size:16px; color:#2C2C2A; margin-bottom:6px;}
.info-desc{font-size:13px; color:#6B7280; line-height:1.6; margin-bottom:14px;}
.info-card select{width:100%; padding:12px; border-radius:10px; border:1px solid #D1D5DB; font-size:15px; background:#fff; color:#2C2C2A; margin-bottom:12px; -webkit-appearance:none; appearance:none;}
.score-label{font-size:13px; color:#374151; font-weight:600; margin-bottom:8px; display:block;}
.score-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:4px;}
.score-item{display:flex; flex-direction:column; gap:4px; text-align:center;}
.score-item span{font-size:12px; color:#6B7280;}
.score-item input{width:100%; padding:9px 4px; border-radius:8px; border:1px solid #D1D5DB; font-size:14px; text-align:center; -moz-appearance:textfield;}
.score-item input::-webkit-outer-spin-button,.score-item input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.score-note{font-size:12px; color:#9CA3AF; margin-bottom:14px;}
.info-btn{width:100%; background:var(--primary); color:#fff; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:4px;}
.info-btn:active{transform:scale(.97);}
.info-result{display:none; margin-top:14px;}
.info-result.show{display:block;}
.info-summary{background:#F8F9FB; border:1px dashed #C9CDD4; border-radius:10px; padding:12px; font-size:13px; line-height:1.8; color:#2C2C2A; white-space:pre-wrap; font-family:inherit; margin-bottom:10px; word-break:break-all; text-align:left;}
.info-copy{width:100%; background:var(--primary); color:#fff; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:8px;}
.info-tip{font-size:12px; color:#6B7280; line-height:1.6; text-align:center;}
.info-tip b{color:var(--primary);}
.lead-card{background:linear-gradient(135deg,#667eea,#764ba2); border-radius:var(--radius); padding:24px; color:#fff; text-align:center; margin-bottom:20px;}
.lead-card h3{font-size:18px; margin-bottom:8px;}
.lead-card p{font-size:13px; opacity:.9; margin-bottom:16px;}
.lead-form{display:none; flex-direction:column; gap:12px; text-align:left;}
.lead-form.show{display:flex;}
.lead-form input, .lead-form select, .lead-form textarea{
  width:100%; padding:12px 14px; border:2px solid rgba(255,255,255,.3); border-radius:10px;
  font-size:15px; background:rgba(255,255,255,.1); color:#fff; outline:none;
}
.lead-form input::placeholder, .lead-form textarea::placeholder{color:rgba(255,255,255,.6);}
.lead-form input:focus, .lead-form select:focus, .lead-form textarea:focus{border-color:#fff;}
.lead-form select option{color:#333;}
.lead-form .btn-lead{background:#fff; color:var(--primary); padding:14px; border-radius:10px; border:none; font-size:16px; font-weight:700; cursor:pointer;}
.lead-form .btn-lead:active{transform:scale(.97);}
.lead-success{display:none; padding:20px; text-align:center;}
.lead-success.show{display:block;}
.lead-success .check{font-size:40px; margin-bottom:8px;}
.lead-weak{background:rgba(255,255,255,.18); border:1px dashed rgba(255,255,255,.55); border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:14px; font-weight:700; line-height:1.5;}
.lead-wechat{margin-bottom:14px;}
.lead-wechat .wl{font-size:12px; opacity:.85; margin-bottom:6px;}
.lead-wechat .wid{font-size:26px; font-weight:800; letter-spacing:1.5px; margin-bottom:10px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.15);}
.lead-wechat .btn-lead{width:100%;}
.lead-call{display:block; background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.6); color:#fff; text-decoration:none; padding:12px; border-radius:10px; font-size:14px; font-weight:600; margin-top:10px;}
.lead-call:active{transform:scale(.97);}
.lead-divider{display:flex; align-items:center; gap:10px; font-size:12px; opacity:.75; margin:18px 0 12px;}
.lead-divider::before,.lead-divider::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.35);}

.result-footer{text-align:center; font-size:12px; color:var(--gray-500); padding-top:16px; border-top:1px solid var(--gray-100);}
.result-actions{display:flex; gap:10px; margin-bottom:20px;}
.result-actions .btn{flex:1; padding:14px; font-size:14px;}

/* 动画 */
.fade-in{animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* 弹出提示 */
.toast{position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:10px 20px; border-radius:8px; font-size:14px; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none;}
.toast.show{opacity:1;}

/* ===== 内容管理 ===== */
.btn-admin{background:none; border:none; color:var(--gray-500); font-size:13px; cursor:pointer; padding:8px 16px; border-radius:8px; opacity:.6;}
.btn-admin:hover{opacity:1; background:var(--gray-100);}
.page-admin{padding:24px 20px 40px; min-height:100vh;}
.admin-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.admin-header h2{font-size:20px; font-weight:800;}
.admin-desc{font-size:13px; color:var(--gray-500); margin-bottom:20px; line-height:1.5;}
.admin-section{background:var(--gray-50); border-radius:14px; padding:16px; margin-bottom:16px;}
.admin-section h3{font-size:15px; font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.admin-section h3 .hint{font-size:12px; color:var(--gray-500); font-weight:400;}
.admin-row{margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--gray-200);}
.admin-row:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.admin-label{font-size:12px; color:var(--gray-500); margin-bottom:4px; display:block;}
.admin-input{width:100%; padding:10px 12px; border:1.5px solid var(--gray-200); border-radius:8px; font-size:14px; outline:none; background:#fff;}
.admin-input:focus{border-color:var(--primary);}
.admin-q-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.admin-q-row .q-num{width:26px; height:26px; background:var(--primary-light); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.admin-q-row select{width:90px; padding:8px; border:1.5px solid var(--gray-200); border-radius:8px; font-size:13px; background:#fff; flex-shrink:0;}
.admin-q-row input{flex:1; padding:8px 10px; border:1.5px solid var(--gray-200); border-radius:8px; font-size:13px; outline:none;}
.admin-q-row input:focus{border-color:var(--primary);}
.admin-q-row .btn-del{width:30px; height:30px; border:none; border-radius:6px; background:var(--danger-light); color:var(--danger); font-size:14px; cursor:pointer; flex-shrink:0;}
.admin-q-row .btn-del:hover{background:var(--danger); color:#fff;}
.admin-q-row .admin-rev{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--gray-500); white-space:nowrap; cursor:pointer; flex-shrink:0; user-select:none;}
.admin-q-row .admin-rev input{width:16px; height:16px; accent-color:var(--danger); cursor:pointer; flex:none;}
.admin-rev-note{font-size:12px; color:var(--gray-500); background:var(--gray-100); border-radius:6px; padding:8px 10px; margin-bottom:10px; line-height:1.6;}
.btn-add{display:block; width:100%; padding:10px; border:2px dashed var(--gray-200); border-radius:10px; background:#fff; color:var(--gray-500); font-size:14px; cursor:pointer; margin-top:8px;}
.btn-add:hover{border-color:var(--primary); color:var(--primary);}
.admin-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;}
.admin-actions .btn{padding:13px 14px; font-size:14px;}
.admin-actions .btn:first-child{flex:2;}
.admin-actions .btn:not(:first-child){flex:1;}
.admin-warn{background:var(--warn-light); border:1px solid var(--warn); color:#92400e; font-size:12.5px; padding:10px 12px; border-radius:10px; margin-bottom:16px; line-height:1.5;}
</style>

<script>
// ============================================================
// 【内容管理】提示：本文件底部有"内容管理"入口，无需懂代码
// 也可直接在网页上修改题目。如需手工修改，请改下面 DEFAULT_* 数据。
// ============================================================

// 缓存原始页面源码（用于导出修改后的新文件）
const PAGE_SOURCE = document.documentElement.outerHTML;

// ====== 默认题库（如需手工改题，只改引号里的中文即可）=====
const DEFAULT_DIMENSIONS = [
  {key:'motivation', name:'学习环境', icon:'🔥', color:'#ef4444', desc:'学校与家庭'},
  {key:'habit', name:'学习习惯', icon:'📅', color:'#f59e0b', desc:'计划与自律'},
  {key:'method', name:'学习方法', icon:'🧠', color:'#8b5cf6', desc:'策略与技巧'},
  {key:'efficiency', name:'学习效率', icon:'⚡', color:'#2563eb', desc:'专注与时间'},
  {key:'mindset', name:'心理状态', icon:'💚', color:'#059669', desc:'情绪与抗压'},
];

const DEFAULT_QUESTIONS = [
  // 学习环境
  {dim:'motivation', text:'我的学习环境安静，不容易被外界打扰'},
  {dim:'motivation', text:'家里有专门供我安静学习的空间'},
  {dim:'motivation', text:'周围同学的玩耍不会影响我的学习'},
  {dim:'motivation', text:'家长的管教方式让我能安心学习'},
  {dim:'motivation', text:'不喜欢的老师不会影响我的学习状态'},
  // 学习习惯
  {dim:'habit', text:'我有固定的学习时间安排表'},
  {dim:'habit', text:'每天我都会提前预习第二天要学的内容'},
  {dim:'habit', text:'下课后我会及时复习当天学的知识'},
  {dim:'habit', text:'我的书桌和学习环境保持整洁有序'},
  {dim:'habit', text:'我能按时完成自己制定的学习计划'},
  // 学习方法
  {dim:'method', text:'我会用思维导图或笔记整理知识框架'},
  {dim:'method', text:'我有专门的错题本，会定期回顾分析'},
  {dim:'method', text:'我能把不同科目、不同章节的知识联系起来'},
  {dim:'method', text:'考试前我会制定系统的复习计划'},
  {dim:'method', text:'针对不同科目，我会采用不同的学习策略'},
  // 学习效率
  {dim:'efficiency', text:'学习时我能保持30分钟以上不走神'},
  {dim:'efficiency', text:'学习时我不会被手机等干扰打断'},
  {dim:'efficiency', text:'我能在计划时间内完成当天的学习任务'},
  {dim:'efficiency', text:'听课时我能抓住重点，而不是逐字逐句记'},
  {dim:'efficiency', text:'我觉得自己的学习时间利用得很充分'},
  // 心理状态
  {dim:'mindset', text:'面对考试我能保持平常心，不太紧张'},
  {dim:'mindset', text:'学习中遇到困难我不会轻易放弃'},
  {dim:'mindset', text:'我对自己的学习能力有信心'},
  {dim:'mindset', text:'我很少因为学习压力感到焦虑或失眠'},
  {dim:'mindset', text:'我能平衡学习和休息，不会过度疲劳'},
];

const OPTIONS = [
  {label:'A', text:'完全不符合', score:1},
  {label:'B', text:'不太符合', score:2},
  {label:'C', text:'一般', score:3},
  {label:'D', text:'比较符合', score:4},
  {label:'E', text:'完全符合', score:5},
];

// 各维度建议
const DEFAULT_ADVICE = {
  motivation: {
    good:'学习环境整体较好，外部干扰可控。继续保持，同时帮助孩子学会主动屏蔽环境中的负面因素。',
    mid:'学习环境一般，建议排查手机、同伴、家长管教等主要干扰源，先稳定一个能专注学习的物理与心理空间。',
    low:'学习环境问题较突出，可能是手机、家庭氛围、同伴关系或师生关系等因素影响。建议优先改善一个最可控的环境变量，必要时与老师或家长沟通。',
  },
  habit: {
    good:'习惯良好，继续保持。可以进一步优化时间管理，尝试番茄工作法等工具。',
    mid:'习惯一般，建议作更具体的分析后，增加或调整日常学习行为，形成新习惯，从整体上提高学习质量。',
    low:'习惯薄弱，需重点改善。建议先建立起听课、作业、复习等学习行为的标准，逐步形成规范的学习习惯，提高日常学习质量。',
  },
  method: {
    good:'方法得当，继续保持。可以探索更高效的方法，如费曼学习法、间隔重复等。',
    mid:'方法一般，建议学会使用思维导图、精准记忆、提取练习等工具方法，提高单项学习效率。',
    low:'方法欠缺，需要重点提升。建议先从"错题整理"和"定期复习"两个最基础方法做起，可寻求专业指导。',
  },
  efficiency: {
    good:'效率高，继续保持。可以尝试在高效时段攻克最难的任务。',
    mid:'效率偏低，需重点改善。建议调整学习策略，建立学习流程和学科知识掌握标准，分学科分板块专项轮流强化练习。',
    low:'效率偏低，需重点改善。建议调整学习策略，建立学习流程，明确各科掌握标准，先从单科突破提能入手。',
  },
  mindset: {
    good:'心态良好，继续保持。遇到波动时及时调整即可。',
    mid:'心态一般，建议学习简单的放松技巧（深呼吸、运动），保持规律作息。',
    low:'心态需关注，建议重视。如果焦虑/失眠持续，建议与家长或专业老师沟通，必要时寻求心理支持。',
  },
};

// ====== 运行时数据（优先使用已保存的修改，否则用默认）=====
let DIMENSIONS = DEFAULT_DIMENSIONS.slice();
let QUESTIONS = DEFAULT_QUESTIONS.slice();
let ADVICE = JSON.parse(JSON.stringify(DEFAULT_ADVICE));

function loadSavedData(){
  try{
    // 导出的新文件自带编辑数据
    if(window.EDITOR_DATA && window.EDITOR_DATA.dimensions){
      DIMENSIONS = window.EDITOR_DATA.dimensions;
      QUESTIONS = window.EDITOR_DATA.questions;
      ADVICE = window.EDITOR_DATA.advice || ADVICE;
    } else {
      // 浏览器本地保存的数据
      const saved = localStorage.getItem('asmt_data');
      if(saved){
        const d = JSON.parse(saved);
        DIMENSIONS = d.dimensions || DIMENSIONS;
        QUESTIONS = d.questions || QUESTIONS;
        ADVICE = d.advice || ADVICE;
      }
    }
  }catch(e){ console.log('load data error', e); }
  // 补全维度描述（旧数据可能没有 desc 字段）
  DIMENSIONS.forEach(d=>{
    if(!d.desc){
      const def = DEFAULT_DIMENSIONS.find(x=>x.key===d.key);
      d.desc = def ? def.desc : '';
    }
  });
}
loadSavedData();

// ====== 状态 ======
let state = {
  current: 0,
  answers: [],
  scores: {},
  totalScore: 0,
};

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
function showToast(msg){toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),2000);}

// ====== 页面渲染 ======
function renderHome(){
  app.innerHTML = `
    <div class="page-home fade-in">
      <div class="home-badge">精简化学习法</div>
      <div class="home-icon">📊</div>
      <h1 class="home-title">学习状态测评（学生版）</h1>
      <p class="home-subtitle">5大维度 · 25道题 · 3分钟出报告</p>
      <div class="home-features">
        <h3>📋 测评说明</h3>
        <ul>
          <li>共25道题，覆盖学习状态核心维度</li>
          <li>每题选择最符合你实际情况的选项</li>
          <li>完成后即时生成雷达图分析报告</li>
          <li>无标准答案，请如实作答，结果更准确</li>
        </ul>
      </div>
      <div class="dim-grid2">
        ${DIMENSIONS.map(d=>`<div class="dim-item"><strong>${d.icon} ${d.name}</strong>${d.desc?`<div class="dd">— ${d.desc}</div>`:''}</div>`).join('')}
        <button class="btn-start" onclick="startQuiz()">开始测评</button>
      </div>
      <div class="home-admin">
        <button class="btn-admin" onclick="openAdmin()">⚙️ 内容管理</button>
      </div>
    </div>
  `;
}

function startQuiz(){
  state.current = 0;
  state.answers = [];
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[state.current];
  const dim = DIMENSIONS.find(d=>d.key===q.dim);
  const progress = (state.current / QUESTIONS.length) * 100;
  const selected = state.answers[state.current];

  app.innerHTML = `
    <div class="page-quiz fade-in">
      <div class="quiz-header">
        <div class="quiz-progress-text">
          <span>第 ${state.current+1} / ${QUESTIONS.length} 题</span>
          <span>${Math.round(progress)}%</span>
        </div>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress}%"></div></div>
      </div>
      <div class="quiz-body">
        <span class="quiz-dim-tag">${dim.icon} ${dim.name}</span>
        <div class="quiz-question">${q.text}</div>
        <div class="quiz-options" id="opts">
          ${OPTIONS.map((o,i)=>`
            <div class="quiz-option ${selected===i?'selected':''}" onclick="selectOption(${i})">
              <span class="opt-label">${o.label}</span>
              <span>${o.text}</span>
            </div>
          `).join('')}
        </div>
        <div class="quiz-nav">
          ${state.current>0 ? `<button class="btn btn-secondary" onclick="prevQuestion()">← 上一题</button>` : ''}
          ${(state.current===QUESTIONS.length-1 && selected!==undefined) ? `<button class="btn btn-primary" onclick="nextQuestion()">完成测评 ✓</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function selectOption(i){
  state.answers[state.current] = i;
  // v1.1（2026-09-25）：点选项直接跳下一题，与技术测评口径一致；最后一题选完停在原地、出"完成测评 ✓"确认
  if(state.current < QUESTIONS.length-1){ state.current++; }
  renderQuestion();
}

function prevQuestion(){
  if(state.current>0){state.current--; renderQuestion();}
}

function nextQuestion(){
  if(state.answers[state.current]===undefined){showToast('请先选择一个选项'); return;}
  if(state.current<QUESTIONS.length-1){
    state.current++;
    renderQuestion();
  } else {
    calculateResult();
  }
}

// ====== 计算结果 ======
function calculateResult(){
  // 初始化
  DIMENSIONS.forEach(d=>state.scores[d.key]={total:0, count:0, percent:0});
  // 累加
  QUESTIONS.forEach((q,i)=>{
    const ansIdx = state.answers[i];
    let score = OPTIONS[ansIdx].score;
    if(q.reverse) score = 6 - score; // 反向题（负面表述）：选"完全符合"反而得1分
    state.scores[q.dim].total += score;
    state.scores[q.dim].count++;
  });
  // 换算百分比
  DIMENSIONS.forEach(d=>{
    const s = state.scores[d.key];
    s.percent = Math.round((s.total / (s.count*5)) * 100);
  });
  state.totalScore = Math.round(DIMENSIONS.reduce((sum,d)=>sum+state.scores[d.key].percent,0)/DIMENSIONS.length);
  renderResult();
  // 51LA 完成测评标记（配合 hashMode，后台可区分"完成测评"访问）
  try{ if(location.hash !== '#done'){ location.hash = '#done'; } }catch(e){}
}

function getLevel(pct){
  if(pct>=80) return 'good';
  if(pct>=60) return 'warn';
  return 'danger';
}

function getAdvice(dimKey, pct){
  const a = ADVICE[dimKey];
  if(pct>=80) return a.good;
  if(pct>=60) return a.mid;
  return a.low;
}

function getResultTitle(score){
  if(score>=80) return {title:'学习状态优秀！', sub:'你已具备高效学习的核心要素，向顶尖冲刺还有精进空间！'};
  if(score>=60) return {title:'学习状态中等', sub:'有一定基础，但离高效学习状态还有一段距离——这正是提分的最大突破口。'};
  return {title:'学习状态需提升', sub:'别担心，识别问题是改善的第一步，系统规划很快能看到变化。'};
}

function renderResult(){
  const {title, sub} = getResultTitle(state.totalScore);
  const level = getLevel(state.totalScore);

  app.innerHTML = `
    <div class="page-result fade-in">
      <div class="result-header">
        <div class="result-score-ring" id="ring">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-label">综合状态指数</span>
        </div>
        <h2 class="result-title">${title}</h2>
        <p class="result-subtitle">${sub}</p>
        <p class="result-index-note">💡 <b>综合状态指数</b>＝五大维度平均分（满分100分）。分数代表整体水平，具体短板请往下看每个维度的明细 👇</p>
      </div>
      <div class="result-chart-wrap">
        <canvas id="radarChart" width="280" height="280"></canvas>
      </div>
      <div class="result-dims">
        ${DIMENSIONS.map(d=>{
          const s = state.scores[d.key];
          const lv = getLevel(s.percent);
          const advice = getAdvice(d.key, s.percent);
          return `
            <div class="result-dim-card lv-${lv}">
              <div class="result-dim-head">
                <span class="result-dim-name">${d.icon} ${d.name}</span>
                <span class="result-dim-score lv-${lv}">${s.percent}分</span>
              </div>
              <div class="result-dim-bar"><div class="result-dim-bar-fill" style="width:${s.percent}%; background:${d.color}"></div></div>
              <div class="result-dim-advice">${advice}</div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="info-card">
        <h3>📋 补充基本信息</h3>
        <p class="info-desc">填一下年级和成绩，老师解读时更有针对性（只需30秒，成绩选填）</p>
        <select id="kidGrade" onchange="toggleScoreBox()">
          <option value="">请选择你就读的年级</option>
          <option value="初一">初一</option>
          <option value="初二">初二</option>
          <option value="初三">初三</option>
          <option value="高一">高一</option>
          <option value="高二">高二</option>
          <option value="高三">高三</option>
        </select>
        <div id="scoreField" style="display:none;">
          <span class="score-label">各科成绩（最近一次大考，没考的科目留空）</span>
          <div class="score-grid">
            <div class="score-item"><span>语文</span><input type="number" id="sc-yuwen" placeholder="如110"></div>
            <div class="score-item"><span>数学</span><input type="number" id="sc-shuxue" placeholder="如95"></div>
            <div class="score-item"><span>英语</span><input type="number" id="sc-yingyu" placeholder="如105"></div>
            <div class="score-item"><span>物理</span><input type="number" id="sc-wuli" placeholder="如60"></div>
            <div class="score-item"><span>化学</span><input type="number" id="sc-huaxue" placeholder="如70"></div>
            <div class="score-item"><span>生物</span><input type="number" id="sc-shengwu" placeholder="如75"></div>
            <div class="score-item"><span>历史</span><input type="number" id="sc-lishi" placeholder="如80"></div>
            <div class="score-item"><span>政治</span><input type="number" id="sc-zhengzhi" placeholder="如78"></div>
            <div class="score-item"><span>地理</span><input type="number" id="sc-dili" placeholder="如76"></div>
          </div>

function animateRing(){
  const ring = document.getElementById('ring');
  const numEl = document.getElementById('scoreNum');
  const deg = (state.totalScore/100)*360;
  ring.style.background = `conic-gradient(var(--primary) ${deg}deg, var(--gray-100) ${deg}deg)`;
  let cur = 0;
  const target = state.totalScore;
  const step = Math.max(1, Math.ceil(target/40));
  const timer = setInterval(()=>{
    cur += step;
    if(cur>=target){cur=target; clearInterval(timer);}
    numEl.textContent = cur;
  }, 25);
}

function drawRadar(){

        data: DIMENSIONS.map(d=>state.scores[d.key].percent),
        backgroundColor:'rgba(102,126,234,0.2)',
        borderColor:'#667eea',
        borderWidth:2,
        pointBackgroundColor:'#667eea',
        pointRadius:4,
        pointHoverRadius:6,
      }]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{
        r:{
          min:0, max:100,
          ticks:{display:false, stepSize:20},
          grid:{color:'#e5e7eb'},
          angleLines:{color:'#e5e7eb'},
          pointLabels:{font:{size:13}, color:'#374151'}

    }
  });
}

async function exportHTML(){
  collectAdminData();
  const data = {dimensions:DIMENSIONS, questions:QUESTIONS, advice:ADVICE};
  const json = JSON.stringify(data).replace(/<\//g, '<\\/');
  // 在 body 开始处注入编辑数据，替换原文件里的默认数据
  let html = PAGE_SOURCE.replace('<body>', '<body>\n<script>window.EDITOR_DATA = ' + json + ';<\/script>');
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const fileName = '学习状态测评-自定义版.html';
  // 方式1：系统保存对话框（Chrome/Edge 支持，弹窗保存，不会跳页）
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({suggestedName: fileName, types:[{description:'HTML 文件', accept:{'text/html':['.html']}}]});
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      showToast('✅ 新文件已保存，路径见刚才的保存窗口');
      return;
    } catch(e) {
      if (e && e.name === 'AbortError') { showToast('已取消保存'); return; }
      // 权限被拒等 → 继续用方式2
    }
  }
  // 方式2：传统下载（隐藏链接，避免页面跳转）
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  showToast('📥 已生成新文件，请看浏览器右上角/底部下载提示');
}
